name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: uv sync
      - run: uv run python -c "import tomllib; tomllib.load(open('config/sources.toml','rb'))"
      - run: uv run pytest -q
