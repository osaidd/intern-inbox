[project]
name = "intern-inbox"
version = "0.1.0"
description = "NYC/NJ internship pipeline for NOC students — ATS boards, job-alert email parsing, and a local triage inbox"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.139.0",
    "python-jobspy>=1.1.82",
    "uvicorn>=0.49.0",
]

[project.scripts]
intern-inbox = "career_inbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career_inbox"]

[tool.uv]
package = true
# python-jobspy 1.1.82 hard-pins numpy==1.26.3, which has no Python-3.14 wheels —
# fresh installs would compile numpy from C source (minutes, or a failed build).
# Override to a wheels-only numpy; pandas 2.3.3 (jobspy's own floor) is numpy-2
# compatible and ships cp314 wheels.
override-dependencies = ["numpy>=2.1"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
