[project]
name = "intern-inbox"
version = "0.1.0"
description = "NYC/NJ internship pipeline for NOC students — ATS boards, job-alert email parsing, and a local triage inbox"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.139.0",
    "python-jobspy>=1.1.82",
    "uvicorn>=0.49.0",
]

[project.scripts]
intern-inbox = "career_inbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career_inbox"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
